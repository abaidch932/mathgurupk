const list=(items)=>`<div class="grid">${items.join('')}</div>`;
const exCard=({c,ch,e},sub)=>`<div class="card"><span class="tag">${c.name}</span><h3>Chapter ${ch.n} – Exercise ${e.n}</h3><p>${esc(sub||e.desc)}</p><a class="btn" href="${exUrl(c,ch,e)}">View Solution</a></div>`;

const R={
home(){seo('Class 9 & 10 Mathematics – New Syllabus','Chapter-wise and exercise-wise Mathematics solutions, notes and PDFs for Class 9 and 10.');
 const latest=allEx().sort((a,b)=>(b.e.added||0)-(a.e.added||0)).slice(0,6);
 return `<div class="hero"><h1>Class 9 & 10 Mathematics – New Syllabus</h1><p>Chapter-Wise & Exercise-Wise Mathematics Solutions, Notes & PDFs</p></div>
 <div class="grid big">${db.classes.map(c=>`<div class="card"><h2 style="margin-top:0">${c.name} Mathematics</h2><p>${c.name} Maths – New Syllabus</p><a class="btn" href="#/${c.slug}">Explore ${c.name}</a></div>`).join('')}</div>
 <h2>Latest Mathematics Solutions</h2>${list(latest.map(x=>exCard(x,x.c.name+' – Chapter '+x.ch.n+' – Exercise '+x.e.n)))}
 <h2>Popular Resources</h2><div class="grid">
 <a class="card" href="#/class-9"><h3>📘 Class 9 Maths PDFs</h3></a><a class="card" href="#/class-10"><h3>📗 Class 10 Maths PDFs</h3></a>
 <a class="card" href="#/pdfs"><h3>📑 Chapter-wise Solutions</h3></a><a class="card" href="#/pdfs"><h3>📝 Exercise-wise Solutions</h3></a><a class="card" href="#/youtube"><h3>🎥 YouTube Lectures</h3></a></div>
 <div class="card" style="text-align:center;margin-top:24px"><h2 style="margin-top:0">Learn Mathematics on YouTube</h2><p>Watch complete chapter-wise and exercise-wise Mathematics lectures on the Math Guru PK YouTube channel.</p>${socialBtns()}</div>`},
cls(c){seo(c.name+' Mathematics – New Syllabus','All '+c.name+' Mathematics chapters with exercise-wise solutions, PDFs and video lectures.');
 return crumb([['Home','#/'],[c.name]])+`<h1>${c.name} Mathematics – New Syllabus</h1>`+list(c.chapters.slice().sort((a,b)=>a.n-b.n).map(ch=>`<div class="card"><span class="tag">Chapter ${ch.n}</span><h3>Chapter ${ch.n} – ${esc(ch.name)}</h3><p>${esc(ch.desc)}<br><b>${ch.exercises.length}</b> exercise${ch.exercises.length==1?'':'s'}</p><a class="btn" href="${chUrl(c,ch)}">View Chapter</a></div>`))+more(c)},
chapter(c,ch){seo(`${c.name} Maths Chapter ${ch.n} – ${ch.name}`,`${c.name} Maths Chapter ${ch.n} ${ch.name}: all exercise solutions with PDFs and videos.`);
 return crumb([['Home','#/'],[c.name,'#/'+c.slug],['Mathematics','#/'+c.slug],['Chapter '+ch.n]])+`<h1>Chapter ${ch.n} – ${esc(ch.name)}</h1><p>${esc(ch.desc)}</p>`+(ch.exercises.length?list(ch.exercises.map(e=>`<div class="card"><h3>Exercise ${e.n}</h3><p>Complete solved questions</p><a class="btn" href="${exUrl(c,ch,e)}">View Exercise</a></div>`)):'<div class="soon">Exercises coming soon.</div>')+more(c)},
exercise(c,ch,e){const i=ch.exercises.indexOf(e),pv=ch.exercises[i-1],nx=ch.exercises[i+1],ttl=`${c.name} Maths Chapter ${ch.n} – Exercise ${e.n}`;
 seo(ttl+' Solution',`${e.desc} ${ttl} PDF and video solution, new syllabus.`);
 return crumb([['Home','#/'],[c.name,'#/'+c.slug],['Mathematics','#/'+c.slug],['Chapter '+ch.n,chUrl(c,ch)],['Exercise '+e.n]])+
 `<h1>${ttl}</h1><p>${esc(e.desc)}</p>
 <section><h2>PDF Solution</h2>${pdfBlock(e.pdf,ttl)}</section>
 <section><h2>🎥 Watch Video Solution</h2>${ytBlock(e.yt,`${c.name} Maths Chapter ${ch.n} | Exercise ${e.n} | Complete Solution`)}<p>${esc(e.desc)}</p></section>
 ${e.questions&&e.questions.length?`<h2>Question-wise Solutions</h2><div class="grid">${e.questions.map(q=>`<div class="card"><h3>Question ${q.n}</h3><a class="btn o" href="${exUrl(c,ch,e)}/question-${q.n}">${q.pdf||q.yt?'View Solution':'Coming soon'}</a></div>`).join('')}</div>`:''}
 <div class="pn">${pv?`<a class="btn o" href="${exUrl(c,ch,pv)}">← Previous: Exercise ${pv.n}</a>`:'<span></span>'}<a class="btn o" href="${chUrl(c,ch)}">Back to Chapter ${ch.n}</a>${nx?`<a class="btn o" href="${exUrl(c,ch,nx)}">Next: Exercise ${nx.n} →</a>`:'<span></span>'}</div>`+more(c)},
question(c,ch,e,q){seo(`${c.name} Chapter ${ch.n} Exercise ${e.n} Question ${q.n}`,`Solution of Question ${q.n}, Exercise ${e.n}, ${c.name} Maths.`);
 return crumb([['Home','#/'],[c.name,'#/'+c.slug],['Chapter '+ch.n,chUrl(c,ch)],['Exercise '+e.n,exUrl(c,ch,e)],['Question '+q.n]])+`<h1>${c.name} Maths Chapter ${ch.n} – Exercise ${e.n}, Question ${q.n}</h1><section><h2>PDF Solution</h2>${pdfBlock(q.pdf,'Q'+q.n)}</section><section><h2>Video</h2>${ytBlock(q.yt,'Question '+q.n)}</section><div class="pn"><a class="btn o" href="${exUrl(c,ch,e)}">← Back to Exercise ${e.n}</a></div>`},
pdfs(){seo('Maths PDFs','Download Class 9 and 10 Mathematics exercise solution PDFs.');return `<h1>Mathematics PDFs</h1>`+list(allEx().filter(x=>x.e.pdf).map(x=>exCard(x,x.e.title)))},
youtube(){seo('YouTube Lectures','Class 9 and 10 Maths video lectures.');return `<h1>YouTube Lectures</h1>`+list(allEx().filter(x=>x.e.yt).map(x=>exCard(x,x.e.title)))+socialBtns(true)},
page(t,b){seo(t,t);return `<h1>${t}</h1><div class="card">${b}</div>`}};
function more(c){return `<h2>More ${c.name} Maths Solutions</h2><div class="row">${c.chapters.map(ch=>`<a class="btn o" href="${chUrl(c,ch)}">Chapter ${ch.n}</a>`).join('')}</div>`}

/* Admin (client-side; data stays in this browser) */
function admin(){seo('Admin','Content manager');
 if(sessionStorage.mgAdmin!=='1'){return `<h1>Admin</h1><div class="card" style="max-width:380px"><label>Password</label><input id="pw" type="password"><p><button class="btn" onclick="login()">Login</button></p><small>After you press Save, the site is republished so every visitor sees the change (open this page while logged in to Claude as the owner).</small></div>`}
 const opts=db.classes.flatMap(c=>c.chapters.map(ch=>`<option value="${c.slug}|${ch.n}">${c.name} – Chapter ${ch.n} ${esc(ch.name)}</option>`)).join('');
 const mb=(JSON.stringify(db).length/1048576).toFixed(1),hot=mb>10,gg=ghCfg()||{},guess=(()=>{const h=location.hostname;if(h.endsWith('.github.io')){const r=location.pathname.split('/')[1];return h.split('.')[0]+'/'+(r&&!/\.html?$/.test(r)?r:h)}return''})(),GHCARD=`<div class="card" style="border-color:${ghReady()?'#2e8b57':'#c0392b'}"><h3>GitHub Auto-Save ${ghReady()?'✅ ON':'⚠ OFF'}</h3><label>Repository (username/repo)</label><input id="ghr" value="${esc(gg.repo||guess)}"><label>Branch</label><input id="ghb" value="${esc(gg.branch||'main')}"><label>Access token ${gg.token?'(saved – leave empty to keep it)':''}</label><input id="ght" type="password" placeholder="github_pat_…" autocomplete="off"><p><button class="btn" onclick="ghSaveCfg()">Save settings</button> <button class="btn o" onclick="ghTest()">Test connection</button> ${gg.token?'<button class="btn r" onclick="ghClear()">Remove token</button>':''}</p><small>${ghReady()?'Every change you make is saved straight to your GitHub repository (data.json and the pdfs folder). No download / upload needed.':'Turn this ON once: paste your token here. It stays only in this browser.'}</small></div>`;
 return `<h1>Content Manager</h1>${GHCARD}<div id="dlbar" class="card" style="display:${window.__dirty?'block':'none'};border-color:#c0392b"><b>⚠ Changes are not live on the website yet</b><br><small>Download the updated file and upload it to your hosting (Netlify etc.), otherwise the changes are lost when you refresh.</small><p><button class="btn" onclick="dl()">⬇ Download updated index.html</button></p></div>${ghReady()?'':`<div class="card" style="border-color:${hot?'#c0392b':'var(--bd)'}"><b>Site data size: ${mb} MB / 16 MB</b><br><small>${hot?'⚠ Almost full – new chapters/exercises may fail to save. Use PDF links (Google Drive) instead of uploading PDF files.':'Tip: use PDF links (Google Drive) instead of uploading big PDF files, so the site stays light.'}</small></div>`}
 <div class="card"><h3>Add Chapter</h3><label>Class</label><select id="ac">${db.classes.map(c=>`<option value="${c.slug}">${c.name}</option>`).join('')}</select><label>Chapter number</label><input id="an" type="number"><label>Chapter name</label><input id="am"><label>Description</label><input id="ad" value="Complete chapter-wise Mathematics notes and exercise solutions."><p><button class="btn" onclick="addCh()">Add Chapter</button> <button class="btn o" onclick="addCls()">+ New Class</button></p></div>
 <div class="card" style="margin-top:16px"><h3>Add / Update Exercise</h3><label>Class · Chapter</label><select id="ec">${opts}</select><label>Exercise (e.g. 4.3)</label><input id="en"><label>Exercise title</label><input id="et"><label>PDF file (uploaded to GitHub) or link</label><input id="ef" type="file" accept="application/pdf"><input id="eu" placeholder="…or paste PDF URL" style="margin-top:6px"><label>YouTube URL</label><input id="ey"><label>Description</label><textarea id="ed"></textarea><label>Question number (optional – attaches PDF/YouTube to this question instead)</label><input id="eq" type="number"><p><button class="btn" onclick="addEx()">Save</button></p></div>
 <div class="card tbl" style="margin-top:16px"><h3>All chapters</h3><table>${db.classes.flatMap(c=>c.chapters.slice().sort((a,b)=>a.n-b.n).map(ch=>`<tr><td>${c.name} – Ch ${ch.n}: ${esc(ch.name)}</td><td>${ch.exercises.length} ex · ${(JSON.stringify(ch).length/1048576).toFixed(1)} MB</td><td><button class="btn r" style="padding:4px 10px;min-height:0" onclick="delCh('${c.slug}',${ch.n})">Delete</button></td></tr>`)).join('')}</table></div>
 <div class="card tbl" style="margin-top:16px"><h3>All exercises</h3><table>${allEx().map(({c,ch,e})=>`<tr><td>${c.name} Ch ${ch.n} Ex ${e.n}</td><td>${e.pdf?'PDF ✓':'–'} ${e.yt?'▶ ✓':'–'}</td><td><button class="btn r" style="padding:4px 10px;min-height:0" onclick="delEx('${c.slug}',${ch.n},'${e.n}')">Delete</button></td></tr>`).join('')}</table></div>
 <div class="row"><button class="btn o" onclick="exp()">Export JSON</button><button class="btn o" onclick="if(confirm('Reset all data?')){db=JSON.parse(JSON.stringify(seed));save()}">Reset to sample</button><button class="btn o" onclick="sessionStorage.mgAdmin='';route()">Logout</button></div>`}
window.login=async()=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode($('#pw').value)),x=[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('');if(x==='b566aa1ce80fadc091b8e52526c279f9d2aa7644ba2f791a5c1c4b183198bec1'){sessionStorage.mgAdmin='1';await loadRemote();route()}else alert('Wrong password')};
window.addCh=()=>{const c=cls($('#ac').value),n=+$('#an').value,m=$('#am').value.trim();if(!n||!m)return alert('Enter number and name');if(c.chapters.some(x=>x.n===n))return alert('Chapter exists');c.chapters.push({n,name:m,desc:$('#ad').value,exercises:[]});save();route()};
window.addCls=()=>{const n=prompt('Class name (e.g. Class 11)');if(!n)return;db.classes.push({slug:n.toLowerCase().replace(/\s+/g,'-'),name:n,chapters:[]});save();route()};
window.addEx=async()=>{const[cs,cn]=$('#ec').value.split('|'),c=cls(cs),ch=c.chapters.find(x=>x.n==cn),n=$('#en').value.trim().replace(/^exercise\s*/i,'');if(!n)return alert('Enter exercise number');
 let pdf=$('#eu').value.trim(),f=$('#ef').files[0];if(f&&f.size>(ghReady()?25e6:1e6)&&!confirm(ghReady()?'This PDF is very large ('+(f.size/1048576).toFixed(1)+' MB). GitHub allows up to 100 MB but visitors will load it slowly. Upload anyway?':'This PDF is '+(f.size/1048576).toFixed(1)+' MB. The whole site is one file with a 16 MB limit, so big PDFs will stop new chapters from saving. Use a PDF link (Google Drive) instead. Upload anyway?'))return;if(f)pdf=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
 let e=ch.exercises.find(x=>x.n===n);if(!e){e={n,title:$('#et').value||`${ch.name} – Exercise ${n}`,desc:$('#ed').value||`Complete step-by-step solution of Exercise ${n}.`,pdf:'',yt:'',questions:[],added:Math.max(0,...allEx().map(x=>x.e.added||0))+1};ch.exercises.push(e);ch.exercises.sort((a,b)=>parseFloat(a.n)-parseFloat(b.n))}
 const qn=+$('#eq').value,t=qn?(e.questions.find(q=>q.n===qn)||(e.questions.push({n:qn,pdf:'',yt:''}),e.questions[e.questions.length-1])):e;
 if(pdf)t.pdf=pdf;if($('#ey').value.trim())t.yt=$('#ey').value.trim();if(!qn){if($('#et').value)e.title=$('#et').value;if($('#ed').value)e.desc=$('#ed').value}
 save();location.hash=exUrl(c,ch,e)};
window.delCh=(cs,n)=>{const c=cls(cs),ch=c&&c.chapters.find(x=>x.n===n);if(!ch)return;if(!confirm('Delete '+c.name+' Chapter '+n+' – '+ch.name+' and its '+ch.exercises.length+' exercise(s)? This cannot be undone.'))return;c.chapters=c.chapters.filter(x=>x.n!==n);save();route()};
window.delEx=(cs,n,en)=>{if(!confirm('Delete Exercise '+en+'?'))return;const ch=cls(cs).chapters.find(x=>x.n===n);ch.exercises=ch.exercises.filter(x=>x.n!==en);save();route()};
window.exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='mathguru-data.json';a.click()};

function route(){const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(x=>{try{return decodeURIComponent(x)}catch(e){return x}});let h;window.scrollTo(0,0);
 const [a,b,c3,d,q]=p;
 if(!a)h=R.home();
 else if(a==='pdfs')h=R.pdfs();else if(a==='youtube')h=R.youtube();else if(a==='admin')h=admin();
 else if(a==='about')h=R.page('About Math Guru PK','<p>Math Guru PK provides chapter-wise and exercise-wise Mathematics solutions, PDFs and video lectures for Class 9 and 10 students following the Punjab Board / PCTB new syllabus.</p>');
 else if(a==='contact')h=R.page('Contact','<p>Email: <a href="mailto:contact@example.com">contact@example.com</a> (replace with your address)</p>');
 else if(a==='privacy')h=R.page('Privacy Policy','<p>Math Guru PK does not collect personal information from visitors. Embedded YouTube videos are subject to YouTube’s own privacy policy.</p>');
 else if(a==='disclaimer')h=R.page('Disclaimer','<p>Content is provided for educational purposes only. Always refer to your official textbook and teacher.</p>');
 else{const c=cls(a);
  if(!c)h=nf();else if(!b)h=R.cls(c);else{
   const ch=c.chapters.find(x=>'chapter-'+x.n===c3||c3===undefined&&false);
   if(!c3)h=R.cls(c);else if(!ch)h=nf();else if(!d)h=R.chapter(c,ch);else{
    const e=ch.exercises.find(x=>'exercise-'+slug(x.n)===d);
    if(!e)h=nf();else if(q){const qq=e.questions.find(x=>'question-'+x.n===q);h=qq?R.question(c,ch,e,qq):nf()}else h=R.exercise(c,ch,e)}}}
 app.innerHTML=h;hydrate()}
const nf=()=>`<h1>Page not found</h1><a class="btn" href="#/">Go Home</a>`;
addEventListener('hashchange',route);app.innerHTML='<p>Loading…</p>';
let booted=false;const boot=()=>{if(!booted){booted=true;route()}};setTimeout(boot,5000);loadRemote().finally(()=>{booted?route():boot()});
$('#q').addEventListener('input',e=>{const t=e.target.value.trim().toLowerCase(),r=$('#res');if(t.length<2){r.style.display='none';return}
 const words=t.split(/\s+/),hits=[];
 db.classes.forEach(c=>c.chapters.forEach(ch=>{
  const chs=`${c.name} maths mathematics chapter ${ch.n} ${ch.name}`.toLowerCase();
  if(words.every(w=>chs.includes(w)))hits.push([`${c.name} – Chapter ${ch.n}: ${ch.name}`,'Chapter',chUrl(c,ch)]);
  ch.exercises.forEach(e=>{const s=`${chs} exercise ${e.n} ${e.title} ${e.desc}`.toLowerCase();
   if(words.every(w=>s.includes(w)))hits.push([`${c.name} – Chapter ${ch.n} – Exercise ${e.n}`,e.title,exUrl(c,ch,e)]);
   (e.questions||[]).forEach(q=>{const s2=`${s} question ${q.n}`;if(/question|q\d/.test(t)&&words.every(w=>s2.includes(w)))hits.push([`${c.name} – Ex ${e.n} – Question ${q.n}`,'Question',exUrl(c,ch,e)+'/question-'+q.n])})})}));
 r.innerHTML=hits.slice(0,10).map(h=>`<a href="${h[2]}" onclick="$('#res').style.display='none'">${esc(h[0])}<br><small>${esc(h[1])}</small></a>`).join('')||'<a>No results</a>';r.style.display='block'});
</script>
</body></html>
